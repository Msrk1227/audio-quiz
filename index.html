<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Voice – Audio Quiz</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--text:#1d1b2e;--muted:#6b6880;--accent:#6c4cf5;--accent2:#ff6b9a;--line:#e3dff5}
@media (prefers-color-scheme:dark){:root{--bg:#15131f;--card:#1f1c2e;--text:#f1eefc;--muted:#a29fbb;--line:#312d47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.left{display:flex;flex-direction:column;justify-content:center;gap:4px}
.right{display:flex;flex-direction:column}
.right .photo{margin-top:0}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
h1{text-align:center;margin:8px 0 4px;font-size:1.8rem}
.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(108,76,245,.12)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--line);color:var(--text)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
audio{width:100%;margin:16px 0}
.photo{height:460px;max-height:70vh;border-radius:16px;margin-top:16px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px dashed var(--line);color:var(--muted);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.name{text-align:center;font-size:1.4rem;font-weight:700;margin:12px 0 0;min-height:1.8rem}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Guess the Voice</h1>
  <p class="sub">Listen to the audio, guess who's speaking, then reveal!</p>
  <div class="card">
    <div class="layout">
      <div class="left">
        <div><span class="badge" id="counter"></span></div>
        <audio id="player" controls></audio>
        <button class="primary" id="reveal">👀 Reveal Photo</button>
        <div class="nav">
          <button id="prev">← Previous</button>
          <button id="next">Next →</button>
        </div>
      </div>
      <div class="right">
        <div class="photo" id="photo"></div>
        <div class="name" id="name"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ====== EDIT THIS LIST ======
   Put audio files in the "audio" folder and photos in the "images" folder
   (next to this index.html). Change names/file names below to match yours. */
var members = [
  { name: "A.P.J.Abdul Kalam",  audio: "audio/1.mp3",  image: "1.jpeg" },
  { name: "Mata Amritanandamayi Devi",  audio: "audio/2.mp3",  image: "images/2.jpeg" },
  { name: "Sadguru",  audio: "audio/3.mp3",  image: "images/3.jpeg" },
  { name: "Narendra Modi",  audio: "audio/4.mp3",  image: "images/4.jpeg" },
  { name: "M.S.Dhoni",  audio: "audio/5.mp3",  image: "images/5.jpeg" },
  { name: "Chaganti Koteswara Rao",  audio: "audio/6.mp3",  image: "images/6.jpeg" },
  { name: "Premanand Maharaj",  audio: "audio/7.mp3",  image: "images/7.jpeg" },
  { name: "S.Jaishankar",  audio: "audio/8.mp3",  image: "images/8.jpeg" },
  { name: "M.S.Subbulakshmi",  audio: "audio/9.mp3",  image: "images/9.jpeg" },
  { name: "Rajinikanth", audio: "audio/10.mp3", image: "images/10.jpeg" }
];
/* ============================ */

var cur = 0, N = members.length;
var $ = function(id){ return document.getElementById(id); };

function load(){
  var m = members[cur];
  $("counter").textContent = "Question " + (cur+1) + " / " + N;
  var p = $("player"); p.pause(); p.src = m.audio; p.load();
  $("photo").textContent = "Who is speaking? 🤔";
  $("name").textContent = "";
  $("reveal").disabled = false;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === N-1;
}
$("reveal").onclick = function(){
  var m = members[cur];
  var img = document.createElement("img");
  img.alt = m.name; img.src = m.image;
  $("photo").textContent = ""; $("photo").appendChild(img);
  $("name").textContent = m.name;
  $("reveal").disabled = true;
};
$("prev").onclick = function(){ if(cur>0){ cur--; load(); } };
$("next").onclick = function(){ if(cur<N-1){ cur++; load(); } };
load();
</script>
</body>
</html>
